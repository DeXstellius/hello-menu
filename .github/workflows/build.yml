
name: Build Geode Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Android NDK 27
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018"

      - name: Build Android64
        id: build
        uses: geode-sdk/build-geode-mod@main
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        with:
          target: Android64

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: HelloMenu-Android
          path: ${{ steps.build.outputs.build-output }}
